name: Catalogue PostgreSQL rehearsal

on:
  pull_request:
    paths:
      - .github/workflows/catalogue-rehearsal.yml
      - scripts/deployment/catalogue_*.py
      - scripts/deployment/database_recovery.py
      - scripts/deployment/postgres_runtime.py
      - scripts/deployment/recovery_crypto.py
      - scripts/deployment/tests/test_database_recovery.py
      - scripts/deployment/tests/test_postgres_runtime.py
      - scripts/deployment/tests/test_recovery_crypto.py
      - scripts/deployment/tests/test_catalogue_*.py
      - inspinia/pages/migrations/0037_catalogue_tables.py
      - inspinia/pages/migrations/0038_seed_catalogue.py
      - inspinia/pages/migrations/0038_catalogue_seed.json
      - inspinia/pages/migrations/0039_catalogue_revision_triggers.py

permissions:
  contents: read

concurrency:
  group: catalogue-rehearsal-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
        env:
          POSTGRES_DB: asterproof_schema_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U postgres -d asterproof_schema_rehearsal" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV_FILE: 'false'
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/asterproof_schema_rehearsal
      # Last verified production revision, before catalogue schema 0037–0039.
      ACTIVE_SHA: 29a2053d9622113a66e34538dade876f0e11b7c5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12.4'
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.12.6'
          enable-cache: false
      - name: Install existing quality dependencies
        run: |
          uv venv .catalogue-quality
          uv pip install --python .catalogue-quality/bin/python -r requirements/local.txt
      - name: Rehearse frozen catalogue migrations and active revision
        run: |
          mkdir "$RUNNER_TEMP/active-catalogue-smoke"
          git archive "$ACTIVE_SHA" | tar -x -C "$RUNNER_TEMP/active-catalogue-smoke"
          .catalogue-quality/bin/python -m scripts.deployment.catalogue_rehearsal \
            --active-source "$RUNNER_TEMP/active-catalogue-smoke" \
            --active-sha "$ACTIVE_SHA" --release-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/catalogue-evidence"
      - name: Run catalogue and reviewed-assignment regressions on PostgreSQL
        run: |
          .catalogue-quality/bin/python - <<'PY'
          from django.conf import settings
          from scripts.deployment.schema_rehearsal import configure_rehearsal_database
          configure_rehearsal_database(settings)
          import pytest
          raise SystemExit(pytest.main([
              "inspinia/pages/test_catalogue_snapshots.py",
              "inspinia/pages/test_concept_progress.py",
              "inspinia/pages/test_concept_assignments.py", "-q",
          ]))
          PY
      - name: Reproduce a real stopped oneshot scheduler on the ephemeral runner
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID .catalogue-quality/bin/python -m pytest \
            scripts/deployment/tests/test_systemd_drain.py -q
      - name: Retain metadata-only rehearsal proof
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.1
        with:
          name: catalogue-postgres-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/catalogue-evidence
          retention-days: 30
      - name: Package private PostgreSQL 17.9 recovery runtime
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          .catalogue-quality/bin/python -m scripts.deployment.postgres_runtime build \
            --container "$POSTGRES_CONTAINER" --source-sha "$GITHUB_SHA" \
            --output "$RUNNER_TEMP/postgres-runtime.tar"
      - name: Install public runtime into its fixed private prefix on the ephemeral runner
        run: |
          archive_digest="$(sha256sum "$RUNNER_TEMP/postgres-runtime.tar" | cut -d' ' -f1)"
          sudo install -m 0400 "$RUNNER_TEMP/postgres-runtime.tar" "$RUNNER_TEMP/postgres-runtime-root.tar"
          sudo .catalogue-quality/bin/python -m scripts.deployment.postgres_runtime install \
            --archive "$RUNNER_TEMP/postgres-runtime-root.tar" --sha256 "$archive_digest" \
            --source-sha "$GITHUB_SHA"
      - name: Verify private runtime with an isolated synthetic dump and restore
        run: |
          .catalogue-quality/bin/python -m scripts.deployment.postgres_runtime smoke \
            > "$RUNNER_TEMP/postgres-runtime-smoke.json"
      - name: Retain verified public PostgreSQL recovery runtime
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v7.0.1
        with:
          name: postgres-recovery-runtime-${{ github.sha }}
          path: |
            ${{ runner.temp }}/postgres-runtime.tar
            ${{ runner.temp }}/postgres-runtime.manifest.json
            ${{ runner.temp }}/postgres-runtime-smoke.json
          retention-days: 30
      - name: Verify encrypted snapshot and complete isolated database restore
        run: |
          .catalogue-quality/bin/python -m scripts.deployment.database_recovery smoke
      - name: Verify encrypted restore across separate users with production systemd isolation
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID,GITHUB_SHA,DATABASE_URL .catalogue-quality/bin/python -m pytest \
            scripts/deployment/tests/test_systemd_recovery.py -q
