name: CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: Exact active production SHA for release rehearsal
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_VERSION: 0.12.6
      PYTHON_VERSION: "3.12.4"
      NODE_VERSION: "22.18.0"
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_READ_DOT_ENV_FILE: "false"
      ACTIONLINT_VERSION: "1.7.7"
      ACTIONLINT_LINUX_AMD64_SHA256: "023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep verify running for documentation PRs so the required check completes.
      - name: Select checks and validate whitespace
        id: checks
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
        run: |
          python3 scripts/ci_checks.py --base "$BASE_SHA"
          git diff --check "$BASE_SHA" HEAD --

      - name: Validate GitHub Actions workflows
        if: steps.checks.outputs.workflows == 'true'
        run: |
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$ACTIONLINT_LINUX_AMD64_SHA256" "$archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" \
            -ignore 'unexpected key "queue" for "concurrency" section' \
            .github/workflows/*.yml

      - name: Set up Python
        if: steps.checks.outputs.runtime == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        if: steps.checks.outputs.runtime == 'true'
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install quality dependencies
        if: steps.checks.outputs.runtime == 'true'
        run: |
          uv venv .ci-quality --python "${PYTHON_VERSION}"
          uv pip install --python .ci-quality/bin/python -r requirements/local.txt

      - name: Validate production lock
        if: steps.checks.outputs.locks == 'true'
        run: python scripts/deployment/check_production_lock.py --verify-resolution

      - name: Rehearse the exact additive schema
        id: website-schema
        if: steps.checks.outputs.runtime == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
          WEBSITE_BASELINE_SHA: 457172aef8d8fa058bf20f140fd64de8eccb9576
          SOLUTION_PDF_BASELINE_SHA: a92717340acafffc07adecef6442cc9a6c58066f
          DATABASE_URL: postgres://postgres@127.0.0.1:5432/asterproof_schema_rehearsal
        run: |
          rehearsal_args=()
          if ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/solution_collections_schema.py scripts/deployment/solution_collections_schema_rehearsal.py scripts/deployment/tests/fixtures/solution-collections-schema-delta.json inspinia/solutions/migrations/0007_solutioncollection_solutioncollectionentry.py; then
            rehearsal=scripts.deployment.solution_collections_schema_rehearsal
            active_sha="$BASE_SHA"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/onboarding_schema.py scripts/deployment/onboarding_schema_rehearsal.py inspinia/users/migrations/0009_user_solution_guide_status.py; then
            rehearsal=scripts.deployment.onboarding_schema_rehearsal
            active_sha="$BASE_SHA"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/solution_analytics_schema.py scripts/deployment/solution_analytics_schema_rehearsal.py inspinia/solutions/migrations/0006_solution_share_daily_views.py; then
            rehearsal=scripts.deployment.solution_analytics_schema_rehearsal
            active_sha="$BASE_SHA"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/solution_sharing_schema.py scripts/deployment/solution_sharing_schema_rehearsal.py inspinia/solutions/migrations/0005_solutionpublicshare.py; then
            rehearsal=scripts.deployment.solution_sharing_schema_rehearsal
            active_sha=cecd909e0def36783065b500cc1ea5692f4f5f59
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/newsletter_automation_schema.py scripts/deployment/newsletter_automation_rehearsal.py inspinia/website/migrations/0003_newsletter_automation.py; then
            rehearsal=scripts.deployment.newsletter_automation_rehearsal
            active_sha=6c90b211fcd74eb08022fb0dee7243b440590ed3
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/solution_pdf_schema.py scripts/deployment/solution_pdf_schema_rehearsal.py inspinia/solutions/migrations/0004_solution_pdf_display_options.py; then
            rehearsal=scripts.deployment.solution_pdf_schema_rehearsal
            active_sha="$SOLUTION_PDF_BASELINE_SHA"
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/newsletter_schema.py scripts/deployment/newsletter_schema_rehearsal.py inspinia/website/migrations/0002_newsletter_campaigns.py; then
            rehearsal=scripts.deployment.newsletter_schema_rehearsal
            active_sha=cadde5c7a0f374dfcd6d19a3abac893f2b1d99b2
          elif ! git diff --quiet "$BASE_SHA" HEAD -- scripts/deployment/website_schema.py scripts/deployment/website_schema_rehearsal.py; then
            rehearsal=scripts.deployment.website_schema_rehearsal
            active_sha="$WEBSITE_BASELINE_SHA"
          else
            exit 0
          fi
          container="asterproof-website-schema-$GITHUB_RUN_ID"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run --detach --rm --name "$container" --memory=768m --cpus=2 \
            -e POSTGRES_DB=asterproof_schema_rehearsal -e POSTGRES_USER=postgres \
            -e POSTGRES_HOST_AUTH_METHOD=trust -p 127.0.0.1:5432:5432 \
            postgres:17.9-bookworm@sha256:47f917f7409eacd22fc5dfb1dee634e1b55cf0c01d1a7eb701be2227a03e0641
          for attempt in $(seq 1 30); do
            if docker exec "$container" pg_isready -U postgres -d asterproof_schema_rehearsal; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo 'Isolated PostgreSQL rehearsal did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          mkdir "$RUNNER_TEMP/website-active-source"
          git archive "$active_sha" | tar -x -C "$RUNNER_TEMP/website-active-source"
          .ci-quality/bin/python -m "$rehearsal" \
            --active-source "$RUNNER_TEMP/website-active-source" --active-sha "$active_sha" \
            --release-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/website-schema-evidence.json" "${rehearsal_args[@]}"
          echo 'ran=true' >> "$GITHUB_OUTPUT"

      - name: Save the additive schema preservation proof
        if: steps.website-schema.outputs.ran == 'true'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: website-schema-rehearsal-${{ github.run_id }}
          path: ${{ runner.temp }}/website-schema-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Set up Node
        if: steps.checks.outputs.static == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Build and collect changed static files
        if: steps.checks.outputs.static == 'true'
        env:
          ASTERPROOF_PYTHON: ${{ github.workspace }}/.ci-quality/bin/python
          DJANGO_SETTINGS_MODULE: config.settings.staticfiles
        run: ./scripts/build_and_collectstatic.sh

      - name: Verify static manifest and representative assets
        if: steps.checks.outputs.static == 'true'
        run: |
          test -s staticfiles/staticfiles.json
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("staticfiles")
          paths = json.loads((root / "staticfiles.json").read_text()).get("paths", {})
          for source in ("css/app.min.css", "js/app.js", "js/vendors.min.js"):
              target = paths.get(source)
              if not target or not (root / target).is_file():
                  raise SystemExit(f"static manifest is missing {source}")
          PY

      - name: Lint and check Django
        if: steps.checks.outputs.runtime == 'true'
        run: |
          .ci-quality/bin/ruff check config scripts
          .ci-quality/bin/python scripts/check_application_lint.py
          .ci-quality/bin/python manage.py check
          .ci-quality/bin/python manage.py makemigrations --check --dry-run

      - name: Test affected areas and core protections
        if: steps.checks.outputs.runtime == 'true'
        env:
          TEST_TARGETS: ${{ steps.checks.outputs.tests }}
        run: |
          .ci-quality/bin/python - <<'PY'
          import json
          import os
          import subprocess
          import sys

          targets = json.loads(os.environ["TEST_TARGETS"])
          if not targets:
              raise SystemExit("Runtime changes must select tests")
          subprocess.run([sys.executable, "-m", "pytest", *targets], check=True)
          PY

      - name: Verify nightly maintenance dependencies on synthetic systemd units
        if: steps.checks.outputs.runtime == 'true'
        run: |
          sudo --preserve-env=GITHUB_ACTIONS,GITHUB_RUN_ID .ci-quality/bin/python -m pytest \
            scripts/deployment/tests/test_systemd_duplicate_schedule.py \
            scripts/deployment/tests/test_systemd_newsletter_schedule.py -q
