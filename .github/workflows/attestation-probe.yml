name: Public Rekor v2 synthetic attestation probe

on:
  push:
    branches: [codex/rekor-v2-attestation-probe]

permissions: {}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install checksum-pinned Sigstore signer
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 90 --proto '=https' \
            https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64 \
            --output "$RUNNER_TEMP/cosign"
          printf '%s  %s\n' 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa "$RUNNER_TEMP/cosign" \
            | sha256sum --check
          chmod 0755 "$RUNNER_TEMP/cosign"

      - name: Prepare the GitHub build provenance predicate
        id: provenance
        uses: actions/attest-build-provenance/predicate@864457a58d4733d7f1574bd8821fa24e02cf7538

      - name: Attest a synthetic artifact with public Rekor v2
        env:
          PREDICATE: ${{ steps.provenance.outputs.predicate }}
          PREDICATE_TYPE: ${{ steps.provenance.outputs.predicate-type }}
        run: |
          set -euo pipefail
          test "$PREDICATE_TYPE" = https://slsa.dev/provenance/v1
          printf '%s\n' "$PREDICATE" > "$RUNNER_TEMP/predicate.json"
          printf 'Synthetic AsterProof signing probe %s/%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/synthetic-signing-probe.txt"
          "$RUNNER_TEMP/cosign" signing-config create --with-default-rekor-v2 --out "$RUNNER_TEMP/signing-config.json"
          jq -e 'any(.rekorTlogUrls[]; .majorApiVersion == 2)' "$RUNNER_TEMP/signing-config.json" >/dev/null
          "$RUNNER_TEMP/cosign" attest-blob --yes --oidc-provider github-actions \
            --type slsaprovenance1 --predicate "$RUNNER_TEMP/predicate.json" \
            --signing-config "$RUNNER_TEMP/signing-config.json" --bundle "$RUNNER_TEMP/bundle.json" \
            "$RUNNER_TEMP/synthetic-signing-probe.txt"
          jq -e 'any(.verificationMaterial.tlogEntries[]; .kindVersion.kind == "hashedrekord" and .inclusionProof != null)' \
            "$RUNNER_TEMP/bundle.json" >/dev/null

      - name: Verify, register, and retrieve the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          verify() {
            gh attestation verify "$RUNNER_TEMP/synthetic-signing-probe.txt" \
              --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/attestation-probe.yml" \
              --signer-digest "$GITHUB_SHA" --source-ref "$GITHUB_REF" --source-digest "$GITHUB_SHA" \
              --deny-self-hosted-runners "$@"
          }
          verify --bundle "$RUNNER_TEMP/bundle.json"
          jq -c '{bundle: .}' "$RUNNER_TEMP/bundle.json" \
            | gh api --method POST "repos/$GITHUB_REPOSITORY/attestations" --input - --jq .id
          verify
