# Install only into the verified application's server block after the image-aware
# compatibility release is active. This is a reviewed configuration fragment,
# never a script or an automatically installed application release component.
# Confirm /media/ is the verified MEDIA_URL before applying this exact fragment.
location = /media/solution_body_images {
    return 404;
}
location ^~ /media/solution_body_images/ {
    add_header Cache-Control "private, no-store, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 404;
}
