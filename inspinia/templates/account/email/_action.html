{% load i18n %}
<table role="presentation" cellpadding="0" cellspacing="0" style="margin: 24px 0;">
  <tr>
    <td align="center" bgcolor="#08796f" style="border-radius: 4px; background-color: #08796f; mso-padding-alt: 12px 22px;">
      <a href="{{ action_url }}" style="display: inline-block; padding: 12px 22px; border: 1px solid #08796f; border-radius: 4px; font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 600; line-height: 20px; color: #ffffff; text-decoration: none;">{{ action_label }}</a>
    </td>
  </tr>
</table>
<p style="margin: 0 0 6px; font-size: 11px; color: #627078;">{% trans "Or copy this link into your browser:" %}</p>
<p style="margin: 0 0 22px; font-size: 11px; line-height: 1.6; overflow-wrap: anywhere; word-break: break-all;"><a href="{{ action_url }}" style="color: #08796f; text-decoration: underline;">{{ action_url }}</a></p>
