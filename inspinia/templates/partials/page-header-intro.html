<div class="d-flex flex-wrap align-items-center justify-content-between flex-grow-1 gap-2">
  <h1 class="page-main-title m-0">{{ title }}</h1>
  {% if back_url or subtitle and subtitle != title %}
    <nav aria-label="Breadcrumb">
      <ol class="breadcrumb m-0 py-0">
        {% if back_url %}<li class="breadcrumb-item"><a href="{{ back_url }}">{{ back_label }}</a></li>{% endif %}
        {% if subtitle and subtitle != title %}<li class="breadcrumb-item">{{ subtitle }}</li>{% endif %}
      </ol>
    </nav>
  {% endif %}
</div>
