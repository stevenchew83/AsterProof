<div class="col">
  <div class="card h-100 mb-0">
    <div class="card-body">
      <dt class="text-body-secondary fw-medium">
        {% if stat_icon %}<i class="ti {{ stat_icon }} me-1" aria-hidden="true"></i>{% endif %}
        {{ label }}
      </dt>
      <dd class="{% if text_value %}fs-md{% else %}fs-xl{% endif %} fw-semibold mb-0{% if accent %} text-primary-emphasis{% endif %}">
        {% if value is not None and value != '' %}{{ value }}{% else %}—{% endif %}{% if unit %} <small>{{ unit }}</small>{% endif %}
      </dd>
    </div>
  </div>
</div>
