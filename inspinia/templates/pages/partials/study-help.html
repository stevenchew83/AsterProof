<section class="card study-help {% if study_help_draft %}mx-3 mb-3{% else %}mt-3 mb-0{% endif %}" data-study-help aria-labelledby="study-help-title"
         {% if study_help_draft %}data-study-help-draft{% endif %}
         data-status-url="{% url 'pages:study_help_status' problem_statement.statement_uuid %}"
         data-request-url="{% url 'pages:study_help_request' problem_statement.statement_uuid %}"
         data-reveal-url="{% url 'pages:study_help_reveal' problem_statement.statement_uuid %}"
         data-click-url="{% url 'pages:study_help_click' problem_statement.statement_uuid %}"
         hidden>
  <div class="card-body study-help-content">
    {% csrf_token %}
    <header class="study-help-header">
      <h2 class="card-title d-flex align-items-center gap-2 mb-0" id="study-help-title">
        <span class="study-help-icon bg-primary-subtle text-primary-emphasis"><i class="ti ti-bulb" aria-hidden="true"></i></span>
        AI study help
      </h2>
      <ul class="study-help-quota list-unstyled mb-0" data-quota aria-label="AI study help usage"></ul>
    </header>
    <div class="study-help-feedback small" data-feedback tabindex="-1" role="status" hidden></div>
    <div class="study-help-controls d-flex flex-wrap align-items-center gap-2" data-controls hidden>
      <div class="d-flex flex-wrap gap-2" data-actions></div>
      <span class="small" data-hint-cost hidden>1 AI credit when ready</span>
    </div>
    <div class="study-help-saved" data-history hidden>
      <span class="small fw-semibold" id="study-help-saved-label">{% if study_help_draft %}Saved hints{% else %}Saved responses{% endif %}</span>
      <ul class="study-help-saved-list list-unstyled mb-0" data-history-list aria-labelledby="study-help-saved-label"></ul>
    </div>
    <div class="study-help-answer" data-confirmation hidden>
      <p class="mb-2" data-confirm-label>Reveal a complete proof for 1 credit?</p>
      <div class="d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary btn-sm" data-confirm>Generate for 1 credit</button>
        <button type="button" class="btn btn-light border text-body-emphasis btn-sm" data-cancel>Cancel</button>
      </div>
    </div>
    <article class="study-help-answer" id="study-help-response" data-answer aria-labelledby="study-help-answer-title" hidden>
      <header class="study-help-answer-header">
        <div class="d-flex flex-wrap align-items-center gap-2">
          <h3 class="fs-6 mb-0" id="study-help-answer-title" data-answer-title tabindex="-1"></h3>
          <span class="badge bg-primary-subtle text-primary-emphasis" data-answer-level hidden></span>
        </div>
        <div class="study-help-answer-actions">
          <button type="button" class="btn btn-sm btn-link d-inline-flex align-items-center gap-1" data-copy title="Copy response with its math notation">
            <i class="ti ti-copy" aria-hidden="true"></i> Copy
          </button>
          <button type="button" class="btn btn-sm btn-link" data-close aria-label="Close response" title="Close response">
            <i class="ti ti-x" aria-hidden="true"></i>
          </button>
        </div>
      </header>
      <div class="study-help-answer-body" data-answer-body></div>
      <footer class="study-help-answer-footer small">
        AI-generated <span class="ms-2" data-copy-feedback role="status"></span>
      </footer>
    </article>
  </div>
</section>
