{% if row.total %}<div class="cp-coverage"><div class="d-flex justify-content-between align-items-center mb-2"><span class="fs-xs cp-number{% if row.total and not row.remaining %} text-primary{% else %} text-muted{% endif %}">{{ row.percent|floatformat:'-1' }}%</span>{% if row.total and not row.remaining %}<i class="ti ti-circle-check text-primary" aria-label="All problems complete"></i>{% endif %}</div><div class="cp-track" role="progressbar" aria-label="{{ row.label }} problem completion" aria-valuenow="{{ row.percent }}" aria-valuemin="0" aria-valuemax="100"><div class="cp-fill" style="width:{{ row.percent|floatformat:'-1' }}%"></div></div></div>{% else %}<span class="text-muted fs-xs">No problems yet</span>{% endif %}
