<div class="community-field{% if field.errors %} community-field--invalid{% endif %}">
  <div class="d-flex align-items-baseline justify-content-between gap-2 mb-1">
    <label for="{{ field.id_for_label }}" class="form-label mb-0">
      {{ field.label }}
      {% if field.field.required %}
        <span class="text-danger" aria-hidden="true">*</span><span class="visually-hidden">(required)</span>
      {% endif %}
    </label>
    {% if private %}
      <span class="community-field-note"><i class="ti ti-lock" aria-hidden="true"></i> Private</span>
    {% elif not field.field.required %}
      <span class="community-field-note">Optional</span>
    {% endif %}
  </div>
  {{ field }}
  {% if field.help_text %}
    <div class="form-text" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</div>
  {% endif %}
  <div class="community-field-errors"
       id="{{ field.id_for_label }}_errors"
       role="alert"
       {% if not field.errors %}hidden{% endif %}>
    {% for error in field.errors %}<p class="mb-0">{{ error }}</p>{% endfor %}
  </div>
</div>
