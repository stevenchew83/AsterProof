<form method="post" action="{% url 'pages:concept_assignment_preview' %}" class="mt-3">
  {% csrf_token %}<input type="hidden" name="problem_uuid" value="{{ source.problem_uuid }}">
  {% if candidate %}<input type="hidden" name="concept_id" value="{{ candidate.id }}">{% else %}<label class="form-label" for="manual-concept">Canonical concept</label><input class="form-control mb-2" id="manual-concept" name="concept_id" list="canonical-concepts" required>{% endif %}
  <div class="row g-3">
    <div class="col-md-6"><label class="form-label" for="action-{{ candidate.id|default:'manual' }}">Decision</label><select class="form-select" id="action-{{ candidate.id|default:'manual' }}" name="action"><option value="{% if candidate %}confirm{% else %}add{% endif %}">{% if candidate %}Confirm with evidence{% else %}Add with evidence{% endif %}</option>{% if candidate %}<option value="hold">Hold</option><option value="reject">Reject</option><option value="replace">Replace with another concept</option>{% endif %}</select></div>
    <div class="col-md-6"><label class="form-label" for="roles-{{ candidate.id|default:'manual' }}">Supported roles</label><select class="form-select" id="roles-{{ candidate.id|default:'manual' }}" name="roles" multiple size="3"><option value="technique">Technique</option><option value="object">Object</option><option value="method">Method</option><option value="lemma">Lemma / theorem</option><option value="proof_role">Proof role</option><option value="canonical_subtopic">Subtopic</option></select></div>
    <div class="col-md-6"><label class="form-label" for="reference-{{ candidate.id|default:'manual' }}">Evidence source</label><select class="form-select" id="reference-{{ candidate.id|default:'manual' }}" name="evidence_reference">{% if source.statement_id %}<option value="statement">Problem statement</option>{% endif %}{% for proof in proofs %}<option value="solution:{{ proof.reference }}">{{ proof.title }}</option>{% endfor %}</select></div>
    <div class="col-md-6"><label class="form-label" for="replace-{{ candidate.id|default:'manual' }}">Replacement ID <span class="text-muted">(replace only)</span></label><input class="form-control" id="replace-{{ candidate.id|default:'manual' }}" name="replacement_concept_id" list="canonical-concepts"></div>
    <div class="col-12"><label class="form-label" for="area-{{ candidate.id|default:'manual' }}">Area in this problem</label><select class="form-select" id="area-{{ candidate.id|default:'manual' }}" name="area_context"><option value="">Use the concept's catalog home</option>{% if candidate %}{% for area in candidate.area_options %}<option value="{{ area.key }}"{% if candidate.record.area_context == area.key %} selected{% endif %}>{{ area.subject }} · {{ area.label }}</option>{% endfor %}{% else %}{% for area in area_options %}<option value="{{ area.key }}">{{ area.subject }} · {{ area.label }}</option>{% endfor %}{% endif %}</select><div class="form-text">A shared method can serve a different area here. This choice applies to this problem only.</div></div>
    <div class="col-12"><label class="form-label" for="quote-{{ candidate.id|default:'manual' }}">Exact supporting excerpt</label><textarea class="form-control" id="quote-{{ candidate.id|default:'manual' }}" name="evidence_quote" rows="2" placeholder="Copy the relevant statement or published-solution excerpt"></textarea></div>
    <div class="col-12"><label class="form-label" for="rationale-{{ candidate.id|default:'manual' }}">Why this decision is justified</label><textarea class="form-control" id="rationale-{{ candidate.id|default:'manual' }}" name="rationale" rows="2" required></textarea></div>
  </div><button class="btn btn-primary mt-3" type="submit">Preview decision</button>
</form>
