{% if read %}
  <p class="text-success mt-3" data-inline-action-success-focus tabindex="-1">Read · current revision</p>
{% else %}
  {% if row.read_earlier %}<p class="text-muted">You read an earlier revision.</p>{% endif %}
  <form data-inline-action method="post"
        action="{% url 'learning:mark_read' path.slug row.key %}"
        class="mt-3">
    {% csrf_token %}
    <input type="hidden" name="revision_id" value="{{ row.revision.pk }}" />
    <button type="submit" class="btn btn-outline-primary">Mark this revision as read</button>
  </form>
{% endif %}
