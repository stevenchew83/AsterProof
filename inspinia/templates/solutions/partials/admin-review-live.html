<script>
  (() => {
    const panel = document.querySelector("[data-ai-review-progress]");
    const poll = async () => {
      if (document.hidden) {
        window.setTimeout(poll, 2500);
        return;
      }
      try {
        const response = await fetch(panel.dataset.aiReviewProgress, {
          cache: "no-store",
          headers: {"Accept": "application/json"},
          signal: AbortSignal.timeout(10000),
        });
        if (response.redirected || response.status === 403) return;
        if (!response.ok) throw new Error("Review status unavailable");
        const {reviews} = await response.json();
        const active = new Map(reviews.filter(row => row.active).map(row => [`ai-review-${row.id}`, row]));
        for (const card of panel.querySelectorAll("[data-ai-review-live]")) {
          const row = active.get(card.id);
          if (!row) {
            window.location.reload();
            return;
          }
          card.querySelector("[data-ai-live-status]").textContent = row.status;
          if (row.feedback) {
            card.querySelector("[data-ai-live-text]").textContent = row.feedback;
            card.querySelector("[data-ai-live-preview]").hidden = false;
          }
        }
        window.setTimeout(poll, 2500);
      } catch {
        window.setTimeout(poll, 10000);
      }
    };
    window.setTimeout(poll, 1500);
  })();
</script>
