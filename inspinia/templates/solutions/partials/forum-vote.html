<form data-inline-action method="post"
      action="{% url 'solutions:forum_action' solution.pk 'upvote' %}">
  {% csrf_token %}
  <input type="hidden"
         name="active"
         value="{% if has_upvoted %}0{% else %}1{% endif %}" />
  <button id="solution-forum-upvote" type="submit"
          class="forum-vote {% if has_upvoted %}is-voted{% endif %}"
          aria-label="{% if has_upvoted %}Remove your upvote{% else %}Upvote solution{% endif %}; {{ vote_count }} upvote{{ vote_count|pluralize }}"
          aria-pressed="{{ has_upvoted|yesno:'true,false' }}"
          title="{% if has_upvoted %}Remove your upvote{% else %}Upvote this solution{% endif %}">
    <i class="ti ti-arrow-up" aria-hidden="true"></i><span>{{ vote_count }}</span><span class="forum-vote-label">
      {% if has_upvoted %}
        Upvoted
      {% else %}
        Upvote
      {% endif %}
    </span>
  </button>
</form>
